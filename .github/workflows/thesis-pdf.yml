name: Thesis PDF

on:
  push:
    branches: [main]
    paths:
      - 'Master-Thesis-Report/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile thesis
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: Master-Thesis-Report
          root_file: main.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          # minted needs the Pygments/latexminted backend at build time.
          extra_system_packages: font-liberation py3-pip py3-pygments
          pre_compile: |
            mkdir -p /etc/fonts/conf.d
            cat > /etc/fonts/conf.d/99-arial.conf << 'EOF'
            <?xml version="1.0"?>
            <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
            <fontconfig>
              <alias binding="same">
                <family>Arial</family>
                <prefer><family>Liberation Sans</family></prefer>
              </alias>
            </fontconfig>
            EOF
            fc-cache -f -v
            # minted 3 drives Pygments through the latexminted backend; install it
            # if the TeX Live image does not already ship it. Non-fatal if present.
            python3 -m pip install --break-system-packages --no-warn-script-location latexminted || true

      - name: Publish latest PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-latest
          name: "Thesis — latest build"
          body: |
            Auto-built from `main` · ${{ github.sha }}
            > Font note: body text uses Liberation Sans (Arial substitute) — final submission should be built locally with Arial installed.
          files: Master-Thesis-Report/main.pdf
          prerelease: true
