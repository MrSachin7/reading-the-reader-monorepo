name: Thesis PDF

on:
  push:
    branches: [main]
    paths:
      - 'Master-Thesis-Report/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile thesis
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: Master-Thesis-Report
          root_file: main.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          # font-liberation supplies the metric-compatible Arial substitute
          # (Liberation Sans); minted needs the Pygments/latexminted backend;
          # inkscape is required by the svg package to convert architecture_overview.svg
          # (\includesvg) to PDF at build time (otherwise: "Inkscape version not detected").
          extra_system_packages: font-liberation py3-pip py3-pygments inkscape
          pre_compile: |
            # Do NOT alias Arial -> Liberation Sans in fontconfig. Settings.tex
            # guards the body font with \IfFontExistsTF{Arial}{...}{Liberation Sans};
            # an alias makes the probe report Arial as present, so XeLaTeX takes the
            # Arial branch and then aborts with "I can't find file 'Arial'". Leaving
            # Arial genuinely absent lets the .tex fall back to Liberation Sans.
            fc-cache -f
            # minted 3 drives Pygments through the latexminted backend; install it
            # if the TeX Live image does not already ship it. Non-fatal if present.
            python3 -m pip install --break-system-packages --no-warn-script-location latexminted || true

      - name: Publish latest PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-latest
          name: "Thesis — latest build"
          body: |
            Auto-built from `main` · ${{ github.sha }}
            > Font note: body text uses Liberation Sans (Arial substitute) — final submission should be built locally with Arial installed.
          files: Master-Thesis-Report/main.pdf
          prerelease: true
