name: Presentation Pages

on:
  push:
    branches:
      - main
    paths:
      - "presentation/**"
      - ".github/workflows/presentation-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: presentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs dependencies
        working-directory: DocsSite
        run: bun install --frozen-lockfile

      - name: Build docs site
        working-directory: DocsSite
        run: bun run build

      - name: Install presentation dependencies
        working-directory: presentation
        run: bun install --frozen-lockfile

      - name: Build presentation
        working-directory: presentation
        run: bun run build

      - name: Add presentation to Pages artifact
        run: |
          mkdir -p DocsSite/out/presentation
          cp -R presentation/dist/. DocsSite/out/presentation/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: DocsSite/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
